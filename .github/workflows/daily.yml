
name: Daily Learning Log

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create daily log
        run: |
          mkdir -p daily-log
          DATE=$(date -u +%F)
          FILE="daily-log/${DATE}.md"

          if [ ! -f "$FILE" ]; then
            printf '# Daily Learning Log - %s\n\n' "$DATE" > "$FILE"
            printf 'Daily learning and project progress.\n' >> "$FILE"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-log/

          if ! git diff --cached --quiet; then
            git commit -m "Update daily learning log"
            git push
          else
            echo "No changes to commit."
          fi
